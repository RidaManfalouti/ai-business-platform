apiVersion: 1

providers:
  - name: 'AI Business Platform Dashboards'
    orgId: 1
    folder: 'Platform Observability'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /etc/grafana/dashboards
      foldersFromFilesStructure: false
