server:
  port: ${PORT:8084}

spring:
  application:
    name: sales-service

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/${POSTGRES_DB:sales_db}
    username: ${POSTGRES_USER:ai_platform}
    password: "${POSTGRES_PASSWORD:0000}"
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

jwt:
  secret: ${JWT_SECRET}

services:
  product-service:
    url: ${PRODUCT_SERVICE_URL:http://localhost:8082}
    connect-timeout-ms: ${PRODUCT_SERVICE_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${PRODUCT_SERVICE_READ_TIMEOUT_MS:3000}
  customer-service:
    url: ${CUSTOMER_SERVICE_URL:http://localhost:8083}
    connect-timeout-ms: ${CUSTOMER_SERVICE_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${CUSTOMER_SERVICE_READ_TIMEOUT_MS:3000}

saga:
  recovery:
    enabled: ${SAGA_RECOVERY_ENABLED:true}
    interval-ms: ${SAGA_RECOVERY_INTERVAL_MS:5000}
    batch-size: ${SAGA_RECOVERY_BATCH_SIZE:10}
    max-attempts: ${SAGA_RECOVERY_MAX_ATTEMPTS:5}
    initial-backoff-ms: ${SAGA_RECOVERY_INITIAL_BACKOFF_MS:1000}
    max-backoff-ms: ${SAGA_RECOVERY_MAX_BACKOFF_MS:30000}
    backoff-multiplier: ${SAGA_RECOVERY_BACKOFF_MULTIPLIER:2.0}
  reconciliation:
    enabled: ${SAGA_RECONCILIATION_ENABLED:true}
    interval-ms: ${SAGA_RECONCILIATION_INTERVAL_MS:60000}
    stale-threshold-minutes: ${SAGA_RECONCILIATION_STALE_MINUTES:15}

