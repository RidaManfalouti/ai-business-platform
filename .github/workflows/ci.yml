name: CI Pipeline

on:
  push:
    branches:
      - main
      - 'feature/**'
      - develop
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  # ============================================================================
  # 1. Quality & Security Checks
  # ============================================================================
  security-checks:
    name: Quality & Security Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scanner (Blocking Check)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

      - name: Run Trivy Dependency Vulnerability Scanner (Informational Check)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0' # Non-blocking informational security warnings

  # ============================================================================
  # 2. Compile & Unit/Integration Tests across all 5 Microservices
  # ============================================================================
  maven-build-and-test:
    name: Build & Test (${{ matrix.service }})
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ai_platform
          POSTGRES_PASSWORD: "0000"
          POSTGRES_DB: ai_platform
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U ai_platform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-service
          - api-gateway
          - product-service
          - customer-service
          - sales-service
          - analytics-service

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up OpenJDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: 'services/**/pom.xml'

      - name: Initialize PostgreSQL Test Databases
        run: |
          for db in auth_db customer_db product_db sales_db analytics_db; do
            PGPASSWORD="0000" psql -h localhost -p 5433 -U ai_platform -d ai_platform -c "CREATE DATABASE $db;" || true
          done

      - name: Compile & Run Maven Tests
        run: |
          mvn -B -f services/${{ matrix.service }}/pom.xml test

      - name: Upload Surefire Test Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: surefire-reports-${{ matrix.service }}
          path: services/${{ matrix.service }}/target/surefire-reports/
          retention-days: 7

  # ============================================================================
  # 3. Docker Compose Validation, Build & Smoke Test
  # ============================================================================
  docker-compose-validate:
    name: Docker Compose Validation & Smoke Test
    runs-on: ubuntu-latest
    needs: [maven-build-and-test]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: |
          cp .env.example .env
          echo "INITIAL_ADMIN_ENABLED=true" >> .env
          echo "INITIAL_ADMIN_EMAIL=ci_admin@example.com" >> .env
          echo "INITIAL_ADMIN_PASSWORD=AdminPassword123!" >> .env
          docker compose config --quiet

      - name: Build All 6 Docker Images
        run: |
          docker compose build

      - name: Start Services & Verify Readiness
        run: |
          docker compose up -d
          echo "Waiting for all containers to report healthy..."
          timeout 240s bash -c '
            until [ "$(docker compose ps --filter "status=running" -q | wc -l)" -eq 12 ] && \
                  [ "$(docker compose ps -a --format json | grep -c "\"Health\":\"healthy\"")" -eq 12 ]; do
              echo "Waiting for healthy containers..."
              docker compose ps
              sleep 5
            done
          ' || {
            echo "Healthcheck timeout! Container status and recent logs:"
            docker compose ps
            docker compose logs --tail=50
            exit 1
          }
          docker compose ps

      - name: Execute Smoke Test through API Gateway
        run: |
          echo "--- 1. Verify Invalid Auth Rejection (401) ---"
          UNAUTH_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST "http://localhost:8080/api/customers" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer invalid-token" \
            -d '{"firstName":"Unauthorized"}')
          [ "$UNAUTH_CODE" -eq 401 ] || { echo "Expected 401, got $UNAUTH_CODE"; exit 1; }

          echo "--- 2. Register & Obtain USER JWT Token ---"
          AUTH_RES=$(curl -s -X POST "http://localhost:8080/api/auth/register" \
            -H "Content-Type: application/json" \
            -d '{"username":"ci_runner","email":"ci_runner@example.com","password":"Password123!"}')
          TOKEN=$(echo "$AUTH_RES" | python3 -c "import sys, json; print(json.load(sys.stdin)['token'])")
          [ -n "$TOKEN" ] || { echo "Failed to acquire JWT token"; exit 1; }

          echo "--- 3. Verify RBAC Rejection for Normal User on Admin Product Creation (403) ---"
          FORBIDDEN_PROD_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST "http://localhost:8080/api/products" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $TOKEN" \
            -d '{"name":"Unauthorized Product","price":100.0,"stockQuantity":5,"category":"Hardware"}')
          [ "$FORBIDDEN_PROD_CODE" -eq 403 ] || { echo "Expected 403, got $FORBIDDEN_PROD_CODE"; exit 1; }

          echo "--- 4. Login as Admin & Obtain Admin JWT Token ---"
          ADMIN_AUTH_RES=$(curl -s -X POST "http://localhost:8080/api/auth/login" \
            -H "Content-Type: application/json" \
            -d '{"email":"ci_admin@example.com","password":"AdminPassword123!"}')
          ADMIN_TOKEN=$(echo "$ADMIN_AUTH_RES" | python3 -c "import sys, json; print(json.load(sys.stdin)['token'])")
          [ -n "$ADMIN_TOKEN" ] || { echo "Failed to acquire Admin JWT token"; exit 1; }

          echo "--- 5. Admin Creates Product (Initial stock: 5) ---"
          PROD_RES=$(curl -s -X POST "http://localhost:8080/api/products" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $ADMIN_TOKEN" \
            -d '{"name":"ThinkStation P620","description":"Workstation","price":2500.00,"stockQuantity":5,"category":"Hardware"}')
          PROD_ID=$(echo "$PROD_RES" | python3 -c "import sys, json; print(json.load(sys.stdin)['id'])")

          echo "--- 6. User Creates Customer ---"
          CUST_RES=$(curl -s -X POST "http://localhost:8080/api/customers" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $TOKEN" \
            -d '{"firstName":"Ada","lastName":"Lovelace","email":"ada.lovelace@example.com","company":"Analytical Engine"}')
          CUST_ID=$(echo "$CUST_RES" | python3 -c "import sys, json; print(json.load(sys.stdin)['id'])")

          echo "--- 7. User Creates Sale with Stock Reservation (Qty: 2) ---"
          SALE_RES=$(curl -s -X POST "http://localhost:8080/api/sales" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Idempotency-Key: CI-IDEMP-KEY-001" \
            -d "{\"customerId\":$CUST_ID,\"items\":[{\"productId\":$PROD_ID,\"quantity\":2}]}")
          SALE_ID=$(echo "$SALE_RES" | python3 -c "import sys, json; print(json.load(sys.stdin)['id'])")

          echo "--- 8. Verify Stock Decremented (5 -> 3) ---"
          STOCK=$(curl -s -H "Authorization: Bearer $TOKEN" "http://localhost:8080/api/products/$PROD_ID" | python3 -c "import sys, json; print(json.load(sys.stdin)['stockQuantity'])")
          [ "$STOCK" -eq 3 ] || { echo "Expected stock 3, got $STOCK"; exit 1; }

          echo "--- 9. Verify Overselling Rejection (409 Conflict) ---"
          OVERSELL_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST "http://localhost:8080/api/sales" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $TOKEN" \
            -d "{\"customerId\":$CUST_ID,\"items\":[{\"productId\":$PROD_ID,\"quantity\":10}]}")
          [ "$OVERSELL_CODE" -eq 409 ] || { echo "Expected 409, got $OVERSELL_CODE"; exit 1; }

          echo "--- 10. Cancel Sale & Verify Stock Compensation (3 -> 5) ---"
          CANCEL_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X PATCH "http://localhost:8080/api/sales/$SALE_ID/status" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $TOKEN" \
            -d '{"status":"CANCELLED"}')
          [ "$CANCEL_CODE" -eq 200 ] || { echo "Expected 200, got $CANCEL_CODE"; exit 1; }

          RESTORED_STOCK=$(curl -s -H "Authorization: Bearer $TOKEN" "http://localhost:8080/api/products/$PROD_ID" | python3 -c "import sys, json; print(json.load(sys.stdin)['stockQuantity'])")
          [ "$RESTORED_STOCK" -eq 5 ] || { echo "Expected restored stock 5, got $RESTORED_STOCK"; exit 1; }

          echo "--- 11. Verify User Cannot Delete Customer (403) ---"
          FORBIDDEN_CUST_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X DELETE "http://localhost:8080/api/customers/$CUST_ID" \
            -H "Authorization: Bearer $TOKEN")
          [ "$FORBIDDEN_CUST_CODE" -eq 403 ] || { echo "Expected 403, got $FORBIDDEN_CUST_CODE"; exit 1; }

          echo "--- 12. Verify Admin Can Delete Customer (204) ---"
          ADMIN_DEL_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X DELETE "http://localhost:8080/api/customers/$CUST_ID" \
            -H "Authorization: Bearer $ADMIN_TOKEN")
          [ "$ADMIN_DEL_CODE" -eq 204 ] || { echo "Expected 204, got $ADMIN_DEL_CODE"; exit 1; }

          echo "--- 13. Verify Normal User Forbidden from Saga Admin Endpoints (403) ---"
          FORBIDDEN_SAGA_CODE=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:8080/api/sales/sagas" \
            -H "Authorization: Bearer $TOKEN")
          [ "$FORBIDDEN_SAGA_CODE" -eq 403 ] || { echo "Expected 403 for user saga list, got $FORBIDDEN_SAGA_CODE"; exit 1; }

          echo "--- 14. Verify Admin Can Query Durable Saga History (200) ---"
          SAGAS_RES=$(curl -s -H "Authorization: Bearer $ADMIN_TOKEN" "http://localhost:8080/api/sales/sagas")
          SAGAS_COUNT=$(echo "$SAGAS_RES" | python3 -c "import sys, json; print(len(json.load(sys.stdin)))")
          [ "$SAGAS_COUNT" -ge 1 ] || { echo "Expected at least 1 persisted saga, got $SAGAS_COUNT"; exit 1; }

          echo "--- 15. Verify Admin Triggers Stock Reconciliation Audit (200) ---"
          RECON_RES=$(curl -s -X POST -H "Authorization: Bearer $ADMIN_TOKEN" "http://localhost:8080/api/sales/reconciliation/run")
          DISCREPANCIES=$(echo "$RECON_RES" | python3 -c "import sys, json; print(json.load(sys.stdin)['discrepanciesCount'])")
          [ "$DISCREPANCIES" -eq 0 ] || { echo "Expected 0 discrepancies, got $DISCREPANCIES"; exit 1; }

          echo "--- 16. Verify Distributed Correlation ID propagation through API Gateway ---"
          CORR_UUID="ci-test-corr-id-001"
          CORR_RESP_HEADER=$(curl -s -i -H "Authorization: Bearer $TOKEN" -H "X-Correlation-ID: $CORR_UUID" "http://localhost:8080/api/products" | grep -i "X-Correlation-ID" | tr -d '\r')
          echo "Correlation response header: $CORR_RESP_HEADER"
          echo "$CORR_RESP_HEADER" | grep -i "$CORR_UUID" || { echo "Expected X-Correlation-ID: $CORR_UUID"; exit 1; }

          echo "--- 17. Verify Analytics Service through API Gateway ---"
          ANALYTICS_RES=$(curl -s -H "Authorization: Bearer $TOKEN" "http://localhost:8080/api/analytics/kpi")
          CURRENCY=$(echo "$ANALYTICS_RES" | python3 -c "import sys, json; print(json.load(sys.stdin).get('currency', ''))")
          echo "Analytics currency: $CURRENCY"
          [ "$CURRENCY" = "EUR" ] || { echo "Expected currency EUR, got $CURRENCY"; exit 1; }

          echo "--- 18. Verify Prometheus Scrapes all 6 Microservices ---"
          TARGETS_RES=$(curl -s "http://localhost:9090/api/v1/targets")
          ACTIVE_TARGETS=$(echo "$TARGETS_RES" | python3 -c "import sys, json; targets = json.load(sys.stdin)['data']['activeTargets']; print(len([t for t in targets if t['health'] == 'up']))")
          echo "Healthy Prometheus active targets: $ACTIVE_TARGETS"
          [ "$ACTIVE_TARGETS" -ge 6 ] || { echo "Expected at least 6 healthy scrape targets, got $ACTIVE_TARGETS"; exit 1; }

          echo "--- 19. Verify Grafana Health and Provisioned Dashboards ---"
          GRAFANA_HEALTH=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:3000/api/health")
          [ "$GRAFANA_HEALTH" -eq 200 ] || { echo "Expected Grafana 200, got $GRAFANA_HEALTH"; exit 1; }
          DASHBOARDS_RES=$(curl -s -u admin:admin "http://localhost:3000/api/search")
          DASHBOARDS_COUNT=$(echo "$DASHBOARDS_RES" | python3 -c "import sys, json; print(len(json.load(sys.stdin)))")
          echo "Provisioned dashboards count: $DASHBOARDS_COUNT"
          [ "$DASHBOARDS_COUNT" -ge 4 ] || { echo "Expected at least 4 provisioned dashboards, got $DASHBOARDS_COUNT"; exit 1; }

          echo "--- 20. Verify Loki Health and Log Ingestion Readiness ---"
          LOKI_READY=$(curl -s "http://localhost:3100/ready")
          [ "$LOKI_READY" = "ready" ] || { echo "Expected Loki ready, got $LOKI_READY"; exit 1; }

          echo "Smoke test passed successfully with RBAC enforcement, durable Saga validation, and full Observability Stack!"

      - name: Teardown Docker Compose
        if: always()
        run: |
          docker compose down -v
